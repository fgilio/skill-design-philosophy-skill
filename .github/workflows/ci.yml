# Standard CI for a fleet repo. The gates run in the shared workflow, and
# `ci-success` here is the one required status check on main, so adding or
# renaming a gate never touches the ruleset.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    uses: fgilio/claude-plugins/.github/workflows/fleet-ci.yml@b64276d7bf245d0eeb541a37637c7000416d6b17 # fleet-ci 2026-11-02
    with:
      profile: prose
  ci-success:
    if: ${{ !cancelled() }}
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
